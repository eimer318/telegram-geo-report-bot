[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-geo-report-bot"
version = "0.1.0"
description = "Telegram bot with JSON and GeoJSON export."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "cryptography==50.0.1",
  "Pillow==12.3.0",
  "python-dotenv==1.2.3",
  "python-telegram-bot==22.8",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "pip-audit>=2.7,<3",
  "ruff>=0.8,<1",
]

[project.scripts]
telegram-geo-report-bot = "telegram_geo_report_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
